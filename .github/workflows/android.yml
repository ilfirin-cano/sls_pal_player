name: Android CI

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android.yml'
      - 'source/encoded/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK platform
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reassemble and extract source archive
        run: |
          mkdir -p app-src
          cat source/encoded/part*.txt | base64 --decode | xz --decompress | tar -x -C app-src

      - name: Apply Kotlin compatibility fixes
        working-directory: app-src
        run: |
          sed -i 's/\.albumList?\.album\.orEmpty()/\.albumList2?\.album\.orEmpty()/' app/src/main/java/dev/soulseek/player/data/navidrome/NavidromeRepository.kt
          sed -i 's/okhttp3\.HttpUrl\.get(base)/base.toHttpUrl()/' app/src/main/java/dev/soulseek/player/data/navidrome/NavidromeStreamDataSource.kt
          sed -i '/import okhttp3.Request/a import okhttp3.HttpUrl.Companion.toHttpUrl' app/src/main/java/dev/soulseek/player/data/navidrome/NavidromeStreamDataSource.kt

      - name: Run unit tests
        working-directory: app-src
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: app-src
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: soulseek-player-debug-apk
          path: app-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soulseek-player-test-reports
          path: app-src/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
